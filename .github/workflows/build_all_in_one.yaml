name: Build / All-In-One

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths:
      - 'all-in-one/**'

  pull_request:
    paths:
      - 'all-in-one/**'

  workflow_call:
    inputs:
      release-summary:
        description: Summary of the release
        required: false
        type: string
        default: ""
      release-url:
        description: URL to the release notes
        required: false
        type: string
        default: ""
      release-version:
        description: Version of the release
        required: false
        type: string
        default: ""

  workflow_dispatch:

jobs:
  configuration:
    name: Build configuration list
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Get All-In-One matrix
        id: set-matrix
        run: echo "matrix=$(ls *.yaml | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT
        working-directory: all-in-one
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate version
        id: version
        run: |
          if [ -n "${{ inputs.release-version }}" ]; then
            version=${{ inputs.release-version }}
          else
            version=dev-$(date +'%Y%m%d-%H%M')
          fi
          echo version=$version >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.config-file }}
    needs:
      - configuration
      - prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config-file: ${{ fromJson(needs.configuration.outputs.matrix) }}
      fail-fast: false
    outputs:
      original-name: ${{ steps.esphome-build.outputs.original-name }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      # ESPHome embeds API/OTA/WebUI/AP credentials in the compiled firmware.
      # Public Actions artifacts are readable by third parties.
      - name: Prevent public build of credential-bearing firmware
        if: matrix.config-file == 'aio_esp32c3.yaml'
        shell: bash
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            echo "::error::Trusted ESP32-C3 firmware contains compiled-in credentials. Build this profile in a private repository, not in public Actions artifacts."
            exit 1
          fi
      - name: Create trusted AIO secrets
        if: matrix.config-file == 'aio_esp32c3.yaml'
        shell: bash
        env:
          API_ENCRYPTION_KEY: ${{ secrets.API_ENCRYPTION_KEY }}
          OTA_PASSWORD: ${{ secrets.OTA_PASSWORD }}
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
          FALLBACK_AP_PASSWORD: ${{ secrets.FALLBACK_AP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          secret_map = {
              "api_encryption_key": "API_ENCRYPTION_KEY",
              "ota_password": "OTA_PASSWORD",
              "web_password": "WEB_PASSWORD",
              "fallback_ap_password": "FALLBACK_AP_PASSWORD",
          }
          missing = [env_name for env_name in secret_map.values() if not os.environ.get(env_name)]
          if missing:
              print("Missing required GitHub Actions secrets: " + ", ".join(missing), file=sys.stderr)
              sys.exit(1)

          with open("all-in-one/secrets.yaml", "w", encoding="utf-8") as handle:
              for yaml_name, env_name in secret_map.items():
                  handle.write(f"{yaml_name}: {json.dumps(os.environ[env_name])}\n")
          PY
      - name: Build firmware
        uses: esphome/build-action@v7
        id: esphome-build
        with:
          yaml-file: all-in-one/${{ matrix.config-file }}
          version: 2026.5.1
          complete-manifest: true
          release-summary: ${{ inputs.release-summary }}
          release-url: ${{ inputs.release-url }}
      - name: Move files for versioning
        run: |
          mkdir -p output/${{ needs.prepare.outputs.version }}
          mv ${{ steps.esphome-build.outputs.name }}/* output/${{ needs.prepare.outputs.version }}/
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('All-In-One-{0}', steps.esphome-build.outputs.name) }}
          path: output

  combine:
    name: Combine manifests
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: files
          pattern: All-In-One-*

      - name: Get artifact names
        id: artifacts
        run: |
          artifacts=$(ls --format=single-column files)
          echo "artifacts<<EOF" >> $GITHUB_OUTPUT
          echo "$artifacts" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Delete artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: ${{ steps.artifacts.outputs.artifacts }}

      - name: Combine all parts into a single manifest
        run: |
          version="${{ needs.prepare.outputs.version }}"
          mkdir -p "output/$version"
          pushd files
          for device in *; do
            pushd $device
            pushd $version
            cp * "../../../output/$version/"
            popd
            popd
          done
          popd
          jq -s '(.[0] | del(.builds)) + {"builds": (reduce .[].builds as $b ([]; . + $b))}' files/*/$version/manifest.json > output/$version/all-in-one-manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: All-In-One
          path: output
