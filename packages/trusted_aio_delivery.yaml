substitutions:
  # Personal C3 profile only; marks the runtime-control/HTTP fix OTA revision.
  project_version: "3.5.62"

# Trusted ESP32-C3 AIO runtime diagnostics.
# HTTP redirects are disabled for every outbound HTTP request in this profile.
http_request:
  follow_redirects: false

globals:
  - id: svitlobot_had_success
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: healthcheck_had_success
    type: bool
    restore_value: no
    initial_value: 'false'
  # Last COMPLETED attempt (not launch); bool distinguishes first attempt from
  # millis() == 0. Unsigned subtraction is safe across uint32_t wraparound.
  - id: aio_svitlobot_last_completed_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: aio_svitlobot_attempt_seen
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: aio_healthcheck_last_completed_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: aio_healthcheck_attempt_seen
    type: bool
    restore_value: no
    initial_value: 'false'
  # 0=automatic/idle, 1=manual SvitloBot, 2=manual HealthCheck.
  - id: aio_manual_target
    type: int
    restore_value: no
    initial_value: '0'

binary_sensor:
  - id: !extend svitlobot_status
    on_state:
      - lambda: |-
          if (x) id(svitlobot_had_success) = true;

  - id: !extend healthcheck_status
    on_state:
      - lambda: |-
          if (x) id(healthcheck_had_success) = true;

  - platform: template
    name: "Restart Recommended"
    id: restart_recommended
    entity_category: diagnostic
    icon: mdi:restart-alert
    lambda: |-
      return id(esp_wifi).is_connected() &&
             id(svitlobot_had_success) && id(healthcheck_had_success) &&
             id(svitlobot_send_errors) > 10 && id(healthcheck_send_errors) > 10 &&
             // A remote HTTP rejection (including HTTP 200 without HC acceptance)
             // is not evidence that restarting the ESP will fix delivery.
             id(svitlobot_delivery_state).state == "Transport error" &&
             id(healthcheck_response_code).state == "---";

# Remove inherited automatic reboot triggers for the other two services.
# The trusted SvitloBot package omits its reboot trigger directly.
sensor:
  - id: !extend healthcheck_errors
    on_value_range: !remove
  - id: !extend custom_url_errors
    on_value_range: !remove

# A changed credential invalidates "previously successful" for that service.
text:
  - id: !extend svitlobot_key
    on_value:
      - lambda: |-
          // Mark any in-flight callback from the previous credentials stale.
          id(svitlobot).invalidate_config();
          id(svitlobot_had_success) = false;
          id(svitlobot_send_errors) = -1;
          id(svitlobot_status).publish_state(false);
          id(svitlobot_response_code).publish_state("");
          id(svitlobot_response_duration).publish_state(NAN);
          id(svitlobot_delivery_state).publish_state("Waiting for next heartbeat");
  - id: !extend svitlobot_relay_url
    device_id: svitlobot_device
    on_value:
      - lambda: |-
          // Mark any in-flight callback from the previous credentials stale.
          id(svitlobot).invalidate_config();
          id(svitlobot_had_success) = false;
          id(svitlobot_send_errors) = -1;
          id(svitlobot_status).publish_state(false);
          id(svitlobot_response_code).publish_state("");
          id(svitlobot_response_duration).publish_state(NAN);
          id(svitlobot_delivery_state).publish_state("Waiting for next heartbeat");
  - id: !extend svitlobot_relay_token
    device_id: svitlobot_device
    on_value:
      - lambda: |-
          // Mark any in-flight callback from the previous credentials stale.
          id(svitlobot).invalidate_config();
          id(svitlobot_had_success) = false;
          id(svitlobot_send_errors) = -1;
          id(svitlobot_status).publish_state(false);
          id(svitlobot_response_code).publish_state("");
          id(svitlobot_response_duration).publish_state(NAN);
          id(svitlobot_delivery_state).publish_state("Waiting for next heartbeat");
  - id: !extend healthcheck_key
    on_value:
      - lambda: |-
          id(healthcheck_had_success) = false;
          id(healthcheck_send_errors) = -1;
          id(healthcheck_ack_result) = 0;
          id(healthcheck_status).publish_state(false);
          id(healthcheck_response_code).publish_state("");
          id(healthcheck_response_duration).publish_state(NAN);

select:
  - id: !extend svitlobot_connection_mode
    device_id: svitlobot_device

# Runtime AIO cadence (all three services). Restored at setup before Shadow starts.
# The local main-loop scheduler re-arms its named timeout when changed;
# an already-running network request is never interrupted. No extra tasks exist.
number:
  - platform: template
    name: "Heartbeat Interval"
    id: aio_heartbeat_interval
    optimistic: true
    restore_value: true
    initial_value: 70
    min_value: 70
    max_value: 300
    step: 5
    mode: box
    unit_of_measurement: "s"
    entity_category: config
    icon: mdi:timer-cog-outline
    on_value:
      then:
        - lambda: |-
            const auto seconds = static_cast<uint32_t>(x);
            id(svitlobot).set_shadow_interval(seconds);
            ESP_LOGI("AIO", "Heartbeat interval set to %u s for all services", seconds);

# Independent network time: Home Assistant is not needed for UTC timestamps.
# Heartbeat never blocks on NTP; retain the honest uptime fallback until synced.
# Requires IoT DNS plus outbound UDP/123 (local NTP can be substituted later).
time:
  - platform: sntp
    id: aio_clock
    timezone: Etc/UTC
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        - logger.log: "AIO: SNTP clock synchronized"

# These inherited hooks run after each real HTTP attempt, whether successful
# or not, for both scheduled and manual service scripts. No secret is published.
script:
  - id: !extend after_svitlobot_request
    then:
      - lambda: |-
          id(aio_svitlobot_last_completed_ms) = millis();
          id(aio_svitlobot_attempt_seen) = true;
          if (id(aio_manual_target) == 1) {
            id(aio_svitlobot_manual_state).publish_state("Completed (see Last Request)");
          }
  - id: !extend after_healthcheck_request
    then:
      - lambda: |-
          id(aio_healthcheck_last_completed_ms) = millis();
          id(aio_healthcheck_attempt_seen) = true;
          if (id(aio_manual_target) == 2) {
            id(aio_healthcheck_manual_state).publish_state("Completed (see Last Request)");
          }
  - id: !extend after_svitlobot_state
    then:
      - lambda: |-
          // A new accepted response re-establishes success independently of
          // binary_sensor.on_state de-duplication.
          if (id(svitlobot_status).state) id(svitlobot_had_success) = true;
          auto clock = id(aio_clock).utcnow();
          const std::string when = clock.is_valid()
              ? clock.strftime("%Y-%m-%d %H:%M:%S UTC")
              : (std::string("uptime ") + std::to_string(millis() / 1000) + "s (clock not synced)");
          const auto &code = id(svitlobot_response_code).state;
          const std::string outcome = id(svitlobot_status).state
              ? "OK (HTTP 200)"
              : (code.empty() || code == "---" ? "FAIL (transport)"
                                             : (std::string("FAIL (HTTP ") + code + ")"));
          id(svitlobot_last_request).publish_state(when + " | " + outcome);

  - id: !extend after_healthcheck_state
    then:
      - lambda: |-
          if (id(healthcheck_status).state) id(healthcheck_had_success) = true;
          auto clock = id(aio_clock).utcnow();
          const std::string when = clock.is_valid()
              ? clock.strftime("%Y-%m-%d %H:%M:%S UTC")
              : (std::string("uptime ") + std::to_string(millis() / 1000) + "s (clock not synced)");
          const auto &code = id(healthcheck_response_code).state;
          std::string outcome;
          if (id(healthcheck_status).state) {
            outcome = "OK (HTTP 200: acknowledged)";
          } else if (code.empty() || code == "---") {
            outcome = "FAIL (transport)";
          } else if (code == "200") {
            const int ack = id(healthcheck_ack_result);
            const char *reason = ack == 2 ? "check not found"
                               : ack == 3 ? "rate limited"
                                          : "unrecognized acknowledgment";
            outcome = std::string("FAIL (HTTP 200: ") + reason + ")";
          } else {
            outcome = std::string("FAIL (HTTP ") + code + ")";
          }
          id(healthcheck_last_request).publish_state(when + " | " + outcome);

  - id: !extend after_custom_url_state
    then:
      - lambda: |-
          auto clock = id(aio_clock).utcnow();
          const std::string when = clock.is_valid()
              ? clock.strftime("%Y-%m-%d %H:%M:%S UTC")
              : (std::string("uptime ") + std::to_string(millis() / 1000) + "s (clock not synced)");
          const auto &code = id(custom_url_response_code).state;
          const std::string outcome = id(custom_url_status).state
              ? "OK (HTTP 200)"
              : (code.empty() || code == "---" ? "FAIL (transport)"
                                             : (std::string("FAIL (HTTP ") + code + ")"));
          id(custom_url_last_request).publish_state(when + " | " + outcome);


# Two authenticated local/HA manual controls. They reuse existing service
# scripts/validation and serialize on the same Shadow gate as the main cycle.
# The successful manual request RE-ARMS the one common automatic timer; check
# HC Period/Grace against this deliberate rescheduling in hardware tests.
# Full heartbeat interval cooldown is measured after the last HTTP completion;
# additional backoff applies after SvitloBot 429 / Healthchecks rate limitation.
button:
  - platform: template
    name: "Send Now"
    id: aio_svitlobot_send_now
    device_id: svitlobot_device
    entity_category: config
    icon: mdi:send
    web_server:
      sorting_group_id: svitlobot_group
      sorting_weight: 8
    on_press:
      - if:
          condition:
            lambda: |-
              if (!id(esp_wifi).is_connected()) {
                id(aio_svitlobot_manual_state).publish_state("No Wi-Fi");
                return false;
              }
              const auto &mode = id(svitlobot_connection_mode).state;
              if (mode == "Paused") {
                id(aio_svitlobot_manual_state).publish_state("Paused");
                return false;
              }
              if (mode != "Direct" && mode != "Custom Relay") {
                id(aio_svitlobot_manual_state).publish_state("Invalid mode");
                return false;
              }
              uint32_t interval_ms =
                  static_cast<uint32_t>(id(aio_heartbeat_interval).state) * 1000U;
              // A rejected request should not invite another manual attempt
              // shortly afterwards. Scheduled behavior remains unchanged.
              const uint32_t gap = id(svitlobot_delivery_state).state == "HTTP 429"
                  ? std::max<uint32_t>(2U * interval_ms, 120000U) : interval_ms;
              if (id(aio_svitlobot_attempt_seen) &&
                  uint32_t(millis() - id(aio_svitlobot_last_completed_ms)) < gap) {
                id(aio_svitlobot_manual_state).publish_state("Cooldown");
                return false;
              }
              if (!id(svitlobot).begin_manual()) {
                id(aio_svitlobot_manual_state).publish_state("Busy / OTA");
                return false;
              }
              id(aio_manual_target) = 1;
              id(aio_svitlobot_manual_state).publish_state("Accepted");
              return true;
          then:
            - script.execute: svitlobot_ping
            - script.wait: svitlobot_ping
            - lambda: |-
                if (id(aio_svitlobot_manual_state).state == "Accepted") {
                  id(aio_svitlobot_manual_state).publish_state("Skipped (preflight)");
                }
                id(aio_manual_target) = 0;
                id(svitlobot).end_manual();

  - platform: template
    name: "Send Now"
    id: aio_healthcheck_send_now
    device_id: healthcheck_device
    entity_category: config
    icon: mdi:send
    web_server:
      sorting_group_id: healthcheck_group
      sorting_weight: 8
    on_press:
      - if:
          condition:
            lambda: |-
              if (!id(esp_wifi).is_connected()) {
                id(aio_healthcheck_manual_state).publish_state("No Wi-Fi");
                return false;
              }
              uint32_t interval_ms =
                  static_cast<uint32_t>(id(aio_heartbeat_interval).state) * 1000U;
              const uint32_t gap =
                  id(healthcheck_ack_result) == 3 || id(healthcheck_response_code).state == "429"
                  ? std::max<uint32_t>(2U * interval_ms, 120000U) : interval_ms;
              if (id(aio_healthcheck_attempt_seen) &&
                  uint32_t(millis() - id(aio_healthcheck_last_completed_ms)) < gap) {
                id(aio_healthcheck_manual_state).publish_state("Cooldown");
                return false;
              }
              if (!id(svitlobot).begin_manual()) {
                id(aio_healthcheck_manual_state).publish_state("Busy / OTA");
                return false;
              }
              id(aio_manual_target) = 2;
              id(aio_healthcheck_manual_state).publish_state("Accepted");
              return true;
          then:
            - script.execute: healthcheck_ping
            - script.wait: healthcheck_ping
            - lambda: |-
                if (id(aio_healthcheck_manual_state).state == "Accepted") {
                  id(aio_healthcheck_manual_state).publish_state("Skipped (preflight)");
                }
                id(aio_manual_target) = 0;
                id(svitlobot).end_manual();

# These fields update even when consecutive HTTP responses have the same code.
# They are grouped with their service in the authenticated ESPHome WebUI and HA.
text_sensor:
  - platform: template
    name: "Manual Request State"
    id: aio_svitlobot_manual_state
    device_id: svitlobot_device
    entity_category: diagnostic
    icon: mdi:send-check
    web_server:
      sorting_group_id: svitlobot_group
      sorting_weight: 9

  - platform: template
    name: "Manual Request State"
    id: aio_healthcheck_manual_state
    device_id: healthcheck_device
    entity_category: diagnostic
    icon: mdi:send-check
    web_server:
      sorting_group_id: healthcheck_group
      sorting_weight: 9

  - platform: template
    name: "Last Request"
    id: svitlobot_last_request
    device_id: svitlobot_device
    entity_category: diagnostic
    icon: mdi:clock-check-outline
    web_server:
      sorting_group_id: svitlobot_group
      sorting_weight: 13

  - platform: template
    name: "Last Request"
    id: healthcheck_last_request
    device_id: healthcheck_device
    entity_category: diagnostic
    icon: mdi:clock-check-outline
    web_server:
      sorting_group_id: healthcheck_group
      sorting_weight: 12

  - platform: template
    name: "Last Request"
    id: custom_url_last_request
    device_id: custom_url_device
    entity_category: diagnostic
    icon: mdi:clock-check-outline
    web_server:
      sorting_group_id: custom_url_group
      sorting_weight: 12
