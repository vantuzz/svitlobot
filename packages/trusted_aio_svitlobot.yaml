substitutions:
  project_name: "ajs.SvitloBot"
  project_version: "3.5.57"

http_request:
  useragent: "esphome/${name} (${project_version})"
  verify_ssl: true
  timeout: 15s

globals:
  - id: svitlobot_send_errors
    type: int
    restore_value: no
    initial_value: '-1'
  - id: svitlobot_attempt_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

web_server:
  version: 3
  sorting_groups:
    - id: svitlobot_group
      name: "💡 SvitloBot"
      sorting_weight: -5

script:
  - id: !extend site_ping
    then:
      - logger.log: "SvitloBot..."
      - script.execute: svitlobot_ping
      - script.wait: svitlobot_ping

  - id: svitlobot_ping
    then:
      - script.execute: before_svitlobot_ping
      - script.wait: before_svitlobot_ping
      - if:
          condition:
            and:
              - wifi.connected:
              - lambda: |-
                  if (id(svitlobot_connection_mode).state == "Direct") {
                    return id(svitlobot_key).has_state() && id(svitlobot_key).state.length() > 3;
                  }
                  if (id(svitlobot_connection_mode).state == "Custom Relay") {
                    if (!id(svitlobot_relay_url).has_state() || !id(svitlobot_relay_token).has_state()) {
                      return false;
                    }
                    const auto &url = id(svitlobot_relay_url).state;
                    return url.rfind("https://", 0) == 0 && url.size() > 8 &&
                           url.find('?') == std::string::npos &&
                           url.find('#') == std::string::npos &&
                           url.find('@') == std::string::npos &&
                           id(svitlobot_relay_token).state.length() >= 16;
                  }
                  return false;
              - lambda: |-
                  return true
                         ${"&& "~lets_ping if lets_ping is defined}
                         ${"&& "~i_am_master if i_am_master is defined};
          then:
            - script.execute: before_svitlobot_request
            - script.wait: before_svitlobot_request
            - lambda: |-
                ++id(svitlobot_attempt_count);
                id(svitlobot_request_count).publish_state(id(svitlobot_attempt_count));
                id(svitlobot_delivery_state).publish_state("Sending");
            - if:
                condition:
                  lambda: 'return id(svitlobot_connection_mode).state == "Custom Relay";'
                then:
                  - http_request.get:
                      url: !lambda |-
                        return id(svitlobot_relay_url).state;
                      request_headers:
                        Authorization: !lambda |-
                          // ESPHome 2026.5.1 needs const char* for templated headers.
                          // Keep the backing string alive until it is copied into Header.
                          static std::string authorization;
                          authorization = std::string("Bearer ") + id(svitlobot_relay_token).state;
                          return authorization.c_str();
                      capture_response: false
                      on_response:
                        then:
                          - lambda: id(svitlobot_set_state)->execute(response->status_code, response->duration_ms);
                      on_error:
                        then:
                          - script.execute:
                              id: svitlobot_set_state
                              code: -1
                              duration: 0
                else:
                  - http_request.get:
                      url: !lambda |-
                        return std::string("https://api.svitlobot.in.ua/channelPing?channel_key=") + id(svitlobot_key).state;
                      capture_response: false
                      on_response:
                        then:
                          - lambda: id(svitlobot_set_state)->execute(response->status_code, response->duration_ms);
                      on_error:
                        then:
                          - script.execute:
                              id: svitlobot_set_state
                              code: -1
                              duration: 0
            - component.update: svitlobot_errors
            - script.execute: after_svitlobot_request
            - script.wait: after_svitlobot_request
          else:
            - script.execute: without_svitlobot_request
            - script.wait: without_svitlobot_request
      - script.execute: after_svitlobot_ping
      - script.wait: after_svitlobot_ping
    mode: single

  - id: svitlobot_set_state
    parameters:
      code: int
      duration: int
    then:
      - script.execute: before_svitlobot_state
      - script.wait: before_svitlobot_state
      - lambda: |-
          if (code > 0) {
            id(svitlobot_response_code).publish_state(std::to_string(code));
          } else {
            ESP_LOGE("SvitloBot", "Request failed!");
            id(svitlobot_response_code).publish_state("---");
          }

          if (duration > 0) {
            id(svitlobot_response_duration).publish_state(duration);
          } else {
            id(svitlobot_response_duration).publish_state(NAN);
          }

          if (code == 200) {
            id(svitlobot_delivery_state).publish_state("Success");
            ESP_LOGI("SvitloBot", "Send status - success");
            id(svitlobot_status).publish_state(true);
            id(svitlobot_send_errors) = 0;
          } else {
            id(svitlobot_delivery_state).publish_state(code > 0 ? ("HTTP " + std::to_string(code)) : "Transport error");
            if (code > 0) {
              ESP_LOGE("SvitloBot", "Send status - not success with response code: %d", code);
            }
            id(svitlobot_status).publish_state(false);
            id(svitlobot_send_errors) = id(svitlobot_send_errors) < 0 ? 1 : std::max(1, ++id(svitlobot_send_errors));
          }
      - script.execute: after_svitlobot_state
      - script.wait: after_svitlobot_state
    mode: single

  - id: before_svitlobot_ping
    then:
      - logger.log: "Before ping..."

  - id: after_svitlobot_ping
    then:
      - logger.log: "After ping..."

  - id: before_svitlobot_request
    then:
      - logger.log: "Before request..."

  - id: after_svitlobot_request
    then:
      - logger.log: "After request..."

  - id: without_svitlobot_request
    then:
      - logger.log: "Without request..."
      - lambda: |-
          // Publish only diagnostic categories: never echo URL, key or token.
          if (!id(esp_wifi).is_connected()) {
            id(svitlobot_delivery_state).publish_state("Waiting for Wi-Fi");
          } else if (id(svitlobot_connection_mode).state == "Paused") {
            id(svitlobot_delivery_state).publish_state("Paused");
          } else if (id(svitlobot_connection_mode).state == "Direct") {
            id(svitlobot_delivery_state).publish_state(
                (!id(svitlobot_key).has_state() || id(svitlobot_key).state.length() <= 3)
                    ? "Direct key missing" : "Skipped by policy");
          } else if (id(svitlobot_connection_mode).state == "Custom Relay") {
            const auto &url = id(svitlobot_relay_url).state;
            const bool valid_url = id(svitlobot_relay_url).has_state() &&
                                   url.rfind("https://", 0) == 0 && url.size() > 8 &&
                                   url.find('?') == std::string::npos &&
                                   url.find('#') == std::string::npos &&
                                   url.find('@') == std::string::npos;
            if (!valid_url) {
              id(svitlobot_delivery_state).publish_state("Invalid Relay URL");
            } else if (!id(svitlobot_relay_token).has_state() ||
                       id(svitlobot_relay_token).state.length() < 16) {
              id(svitlobot_delivery_state).publish_state("Relay token missing/short");
            } else {
              id(svitlobot_delivery_state).publish_state("Skipped by policy");
            }
          } else {
            id(svitlobot_delivery_state).publish_state("Invalid mode");
          }

  - id: before_svitlobot_state
    then:
      - logger.log: "Before state..."

  - id: after_svitlobot_state
    then:
      - logger.log: "After state..."

text:
  - platform: template
    name: "Key"
    id: svitlobot_key
    optimistic: true
    min_length: 0
    max_length: 15
    mode: password
    restore_value: true
    icon: mdi:key-chain-variant
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: svitlobot_group
      sorting_weight: 5

  - platform: template
    name: "Relay URL"
    id: svitlobot_relay_url
    optimistic: true
    min_length: 0
    max_length: 220
    mode: password
    restore_value: true
    icon: mdi:web
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: svitlobot_group
      sorting_weight: 6

  - platform: template
    name: "Relay Token"
    id: svitlobot_relay_token
    optimistic: true
    min_length: 0
    max_length: 128
    mode: password
    restore_value: true
    icon: mdi:key-chain-variant
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: svitlobot_group
      sorting_weight: 7

select:
  - platform: template
    name: "Connection Mode"
    id: svitlobot_connection_mode
    options:
      - Direct
      - Custom Relay
      - Paused  # Append only: ESPHome restores saved select by option index.
    initial_option: Direct
    restore_value: true
    optimistic: true
    entity_category: config
    web_server:
      sorting_group_id: svitlobot_group
      sorting_weight: 4
    set_action:
      - lambda: |-
          id(svitlobot_send_errors) = -1;
          id(svitlobot_had_success) = false;
          id(svitlobot_status).publish_state(false);
          id(svitlobot_response_code).publish_state("");
          id(svitlobot_response_duration).publish_state(NAN);
          id(svitlobot_delivery_state).publish_state("Waiting for next heartbeat");

binary_sensor:
  - platform: template
    name: "Status"
    id: svitlobot_status
    icon: mdi:lan-connect
    web_server:
      sorting_group_id: svitlobot_group
      sorting_weight: 1

sensor:
  - platform: template
    name: "Request Count"
    id: svitlobot_request_count
    device_id: svitlobot_device
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: mdi:counter
    web_server:
      sorting_group_id: svitlobot_group
      sorting_weight: 12

  - platform: template
    name: "Delivery Errors"
    id: svitlobot_errors
    lambda: |-
      if (id(svitlobot_send_errors) < 0) return NAN;
      if (id(svitlobot_connection_mode).state == "Direct") {
        if (!id(svitlobot_key).has_state() || id(svitlobot_key).state.length() <= 3) return NAN;
      } else if (id(svitlobot_connection_mode).state == "Custom Relay") {
        if (!id(svitlobot_relay_url).has_state() || !id(svitlobot_relay_token).has_state()) return NAN;
      } else {
        return NAN;
      }
      return id(svitlobot_send_errors);
    accuracy_decimals: 0
    icon: mdi:space-invaders
    unit_of_measurement: "error"
    web_server:
      sorting_group_id: svitlobot_group
      sorting_weight: 3
  - platform: template
    name: "Response Duration"
    id: svitlobot_response_duration
    icon: mdi:timer-outline
    entity_category: diagnostic
    disabled_by_default: true
    device_class: duration
    state_class: measurement
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    web_server:
      sorting_group_id: svitlobot_group
      sorting_weight: 11

text_sensor:
  - platform: template
    name: "Delivery State"
    id: svitlobot_delivery_state
    device_id: svitlobot_device
    entity_category: diagnostic
    icon: mdi:information-outline
    web_server:
      sorting_group_id: svitlobot_group
      sorting_weight: 9

  - platform: template
    name: "Response Code"
    id: svitlobot_response_code
    icon: mdi:web
    entity_category: diagnostic
    disabled_by_default: true
    web_server:
      sorting_group_id: svitlobot_group
      sorting_weight: 10
