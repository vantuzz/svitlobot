substitutions:
  project_name: "ajs.HealthCheck"
  project_version: "3.5.57"

http_request:
  useragent: "esphome/${name} (${project_version})"
  verify_ssl: true
  timeout: 15s

globals:
  - id: healthcheck_send_errors
    type: int
    restore_value: no
    initial_value: '-1'
  # 0=not evaluated, 1=accepted, 2=not found, 3=rate limited, 4=unexpected body.
  # Local diagnostics only; never contains UUID or server response text.
  - id: healthcheck_ack_result
    type: int
    restore_value: no
    initial_value: '0'

web_server:
  version: 3
  sorting_groups:
    - id: healthcheck_group
      name: "❤️ HealthCheck"
      sorting_weight: -3

script:
  - id: !extend site_ping
    then:
      - logger.log: "HealthCheck..."
      - script.execute: healthcheck_ping
      - script.wait: healthcheck_ping

  - id: healthcheck_ping
    then:
      - script.execute: before_healthcheck_ping
      - script.wait: before_healthcheck_ping
      - if:
          condition:
            and:
              - wifi.connected:
              - lambda: 'return id(healthcheck_key).has_state();'
              - lambda: 'return id(healthcheck_key).state.length() > 3;'
              - lambda: |-
                  return true
                         ${"&& "~lets_ping if lets_ping is defined}
                         ${"&& "~i_am_master if i_am_master is defined}
                         ${"&& "~trusted_aio_healthcheck_gate if trusted_aio_healthcheck_gate is defined};
          then:
            - script.execute: before_healthcheck_request
            - script.wait: before_healthcheck_request
            - http_request.get:
                url: !lambda |-
                  return std::string("https://hc-ping.com/") + id(healthcheck_key).state;
                # HTTP 200 alone is NOT confirmation: unknown UUIDs and rate-limited
                # pings also return 200. Only the exact body "OK" is accepted.
                capture_response: true
                max_response_buffer_size: 64
                on_response:
                  then:
                    - lambda: |-
                        int acknowledgment = 0;
                        if (response->status_code == 200) {
                          // ESPHome invokes on_response even after a read error/timeout.
                          // Never accept a truncated prefix such as "OK" from a longer body.
                          if (!response->is_read_complete() ||
                              response->get_bytes_read() != body.size()) acknowledgment = 4;
                          else if (body == "OK") acknowledgment = 1;
                          else if (body == "OK (not found)") acknowledgment = 2;
                          else if (body == "OK (rate limited)") acknowledgment = 3;
                          else acknowledgment = 4;  // Missing, truncated, or unknown response.
                        }
                        id(healthcheck_set_state)->execute(
                            response->status_code, response->duration_ms, acknowledgment);
                on_error:
                  then:
                    - script.execute:
                        id: healthcheck_set_state
                        code: -1
                        duration: 0
                        acknowledgment: 0
            - component.update: healthcheck_errors
            - script.execute: after_healthcheck_request
            - script.wait: after_healthcheck_request
          else:
            - script.execute: without_healthcheck_request
            - script.wait: without_healthcheck_request
      - script.execute: after_healthcheck_ping
      - script.wait: after_healthcheck_ping
    mode: single

  - id: healthcheck_set_state
    parameters:
      code: int
      duration: int
      acknowledgment: int
    then:
      - script.execute: before_healthcheck_state
      - script.wait: before_healthcheck_state
      - lambda: |-
          id(healthcheck_ack_result) = acknowledgment;
          if (code > 0) {
            id(healthcheck_response_code).publish_state(std::to_string(code));
          } else {
            ESP_LOGE("HealthCheck", "Request failed!");
            id(healthcheck_response_code).publish_state("---");
          }

          if (duration > 0) {
            id(healthcheck_response_duration).publish_state(duration);
          } else {
            id(healthcheck_response_duration).publish_state(NAN);
          }

          if (code == 200 && acknowledgment == 1) {
            ESP_LOGI("HealthCheck", "Ping acknowledged");
            id(healthcheck_status).publish_state(true);
            id(healthcheck_send_errors) = 0;
          } else {
            if (code == 200) {
              ESP_LOGW("HealthCheck", "HTTP 200 without confirmed ping acknowledgment (category %d)", acknowledgment);
            } else if (code > 0) {
              ESP_LOGE("HealthCheck", "Ping failed with HTTP status %d", code);
            }
            id(healthcheck_status).publish_state(false);
            id(healthcheck_send_errors) = id(healthcheck_send_errors) < 0 ? 1 : std::max(1, ++id(healthcheck_send_errors));
          }
      - script.execute: after_healthcheck_state
      - script.wait: after_healthcheck_state
    mode: single

  - id: before_healthcheck_ping
    then:
      - logger.log: "Before ping..."

  - id: after_healthcheck_ping
    then:
      - logger.log: "After ping..."

  - id: before_healthcheck_request
    then:
      - logger.log: "Before request..."

  - id: after_healthcheck_request
    then:
      - logger.log: "After request..."

  - id: without_healthcheck_request
    then:
      - logger.log: "Without request..."

  - id: before_healthcheck_state
    then:
      - logger.log: "Before state..."

  - id: after_healthcheck_state
    then:
      - logger.log: "After state..."

text:
  - platform: template
    name: "Key"
    id: healthcheck_key
    optimistic: true
    min_length: 0
    max_length: 36
    mode: password
    restore_value: true
    icon: mdi:key-chain-variant
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: healthcheck_group
      sorting_weight: 5

binary_sensor:
  - platform: template
    name: "Status"
    id: healthcheck_status
    icon: mdi:lan-connect
    web_server:
      sorting_group_id: healthcheck_group
      sorting_weight: 1

sensor:
  - platform: template
    name: "Delivery Errors"
    id: healthcheck_errors
    lambda: |-
      if (!id(healthcheck_key).has_state() || id(healthcheck_send_errors) < 0) {
        return NAN;
      }
      return id(healthcheck_send_errors);
    accuracy_decimals: 0
    icon: mdi:space-invaders
    unit_of_measurement: "error"
    web_server:
      sorting_group_id: healthcheck_group
      sorting_weight: 3
    on_value_range:
      - above: 10.0
        then:
          - button.press: Restart

  - platform: template
    name: "Response Duration"
    id: healthcheck_response_duration
    icon: mdi:timer-outline
    entity_category: diagnostic
    disabled_by_default: true
    device_class: duration
    state_class: measurement
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    web_server:
      sorting_group_id: healthcheck_group
      sorting_weight: 11

text_sensor:
  - platform: template
    name: "Response Code"
    id: healthcheck_response_code
    icon: mdi:web
    entity_category: diagnostic
    disabled_by_default: true
    web_server:
      sorting_group_id: healthcheck_group
      sorting_weight: 10
