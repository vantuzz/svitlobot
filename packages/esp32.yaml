substitutions:
  comment: "ESPHome Svitlo Bot | Shadow"

wifi:
  enable_btm: true
  enable_rrm: true

# Use the reviewed local component instead of running the upstream FreeRTOS/OTA
# lifecycle that deletes its task and cannot recover from OTA abort/error.
external_components:
  - source:
      type: local
      path: ../components
    components: [shadow]

shadow:
  id: svitlobot
  script_id: site_ping
  startup_delay: 5s
  interval: ${heartbeat_interval}s

sensor:
  - platform: internal_temperature
    name: Device Temperature
    id: esp_temperature
    entity_category: diagnostic
    icon: mdi:coolant-temperature
    device_class: temperature
    disabled_by_default: true
